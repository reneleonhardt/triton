version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      compatible-updates:
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
