name: Wheels
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/wheels.yml
      - CMakeLists.txt
      - pyproject.toml
      - setup.py
      - python/src/**
      - python/test/unit/runtime/test_bindings.py
      - python/test/unit/runtime/test_build.py
      - python/triton/runtime/build.py
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:

  Build-Wheels:
    if: github.repository == 'triton-lang/triton' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    runs-on: ${{ matrix.config.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - {runs_on: ['self-hosted', 'CPU'], arch: 'x86_64'}
        - {runs_on: 'ubuntu-22.04-arm', arch: 'aarch64'}


    permissions:
      attestations: write
      id-token: write
      contents: read

    # The self-hosted x86_64 runner ships a docker CLI (1.52) newer than the
    # daemon's max API version (1.43), so unpinned docker commands fail with
    # "client version 1.52 is too new". Pin at the job level so every step
    # (including cibuildwheel's internal docker invocations) inherits it.
    env:
      DOCKER_API_VERSION: "1.43"
      BUILD_ARCH: ${{ matrix.config.arch }}
      PUBLISH_NIGHTLY: ${{ github.repository == 'triton-lang/triton' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

    steps:

      - name: Prune stale docker containers
        run: |
          # If cibuildwheel crashes (or, say, is OOM-killed), it leaves behind a
          # docker container.  Eventually these consume all the disk space on
          # this machine.
          docker container prune -f

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The LATEST_DATE here should be kept in sync with the one in Patch setup.py
      - id: check-version
        name: Check latest version
        run: |
          PACKAGE_DATE=$(python3 -c 'import re, urllib.request; html = urllib.request.urlopen("https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/Triton-Nightly/pypi/simple/triton-nightly/", timeout=30).read().decode(); dates = re.findall(r"triton[-_]nightly-[^\"<>/]+?\.dev(\d+)", html); assert dates, "No published nightly wheel versions found"; print(max(dates))')
          LATEST_DATE=$(TZ=UTC0 git show --quiet --date='format-local:%Y%m%d%H%M%S' --format="%cd")
          if cmp -s <(echo "$PACKAGE_DATE") <(echo "$LATEST_DATE"); then
            echo "new_commit=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Patch setup.py
        if: ${{ steps.check-version.outputs.new_commit == 'true' }}
        run: |
          printf '\n[build_ext]\nbase-dir=/project\n' >> python/setup.cfg

      - name: Build wheels
        if: ${{ steps.check-version.outputs.new_commit == 'true' }}
        run: |
          python --version
          python3 -m pip install uv --user
          python3 -m uv venv "$RUNNER_TEMP/wheel-tools"
          python3 -m uv pip install --python "$RUNNER_TEMP/wheel-tools/bin/python" --group wheels
          export PATH="$RUNNER_TEMP/wheel-tools/bin:$PATH"
          # Pass MAX_JOBS=4 because, at time of writing, the VM "only" has 32GB
          # of RAM and OOMs while building if we give it the default number of
          # workers (2 * NUM_CPUs).
          export CIBW_ENVIRONMENT="MAX_JOBS=4 \
                  TRITON_EXT_ENABLED=ON \
                  TRITON_BUILD_WITH_CLANG_LLD=1"

          # Install Clang/LLD in the manylinux build image.
          export CIBW_BEFORE_ALL="dnf install clang lld -y"

          # Skip auditwheel's dependency-bundling pass on libtriton.so. Without
          # this, every shared library libtriton.so links against is copied into
          # triton.libs/ and the wheel grows by ~130MB. PyTorch's build script
          # uses the same flag for the same reason.
          export CIBW_REPAIR_WHEEL_COMMAND_LINUX="auditwheel repair --exclude libtriton.so -w {dest_dir} {wheel}"

          CIBW_TEST_REQUIRES=$(python -c 'import tomllib; print(" ".join(tomllib.load(open("pyproject.toml", "rb"))["dependency-groups"]["wheel-tests"]))')
          export CIBW_TEST_REQUIRES
          export CIBW_TEST_COMMAND="python -m pytest -s --tb=short \
                  {project}/python/test/unit/runtime/test_bindings.py::test_free_threaded_bindings \
                  {project}/python/test/unit/runtime/test_bindings.py::test_llvm_ir_to_bitcode \
                  {project}/python/test/unit/runtime/test_bindings.py::test_llvm_ir_to_bitcode_reports_invalid_ir \
                  {project}/python/test/unit/runtime/test_bindings.py::test_binding_classes_released_at_shutdown \
                  {project}/python/test/unit/runtime/test_build.py::test_compile_module \
                  {project}/python/test/unit/language/test_frontend.py && \
                  python -m pytest -s --tb=short {project}/python/test/gluon/test_frontend.py"

          # Version-specific wheel for Python 3.11.
          export CIBW_BUILD="cp311-manylinux_$BUILD_ARCH"
          export CIBW_SKIP="cp{35,36,37,38,39,310}-*"
          python3 -m cibuildwheel . --output-dir wheelhouse

          # Build once on 3.12; cibuildwheel reuses and tests the abi3 wheel through 3.15.
          export CIBW_BUILD="cp3{12,13,14,15}-manylinux_$BUILD_ARCH"
          export CIBW_ENVIRONMENT="MAX_JOBS=4 TRITON_EXT_ENABLED=ON TRITON_BUILD_WITH_CLANG_LLD=1 TRITON_STABLE_ABI=ON"
          python3 -m cibuildwheel . --output-dir wheelhouse

          # Free-threaded CPython uses version-specific native wheels, never abi3.
          export CIBW_BUILD="cp3{14,15}t-manylinux_$BUILD_ARCH"
          export CIBW_ENVIRONMENT="MAX_JOBS=4 TRITON_EXT_ENABLED=ON TRITON_BUILD_WITH_CLANG_LLD=1 TRITON_BUILD_PROTON=OFF"
          python3 -m cibuildwheel . --output-dir wheelhouse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-manylinux_2_28_${{ matrix.config.arch }}-wheels-upload
          path: ./wheelhouse/*.whl

      - name: Install Azure CLI
        if: ${{ steps.check-version.outputs.new_commit == 'true' && env.PUBLISH_NIGHTLY == 'true' }}
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Azure login
        if: ${{ steps.check-version.outputs.new_commit == 'true' && env.PUBLISH_NIGHTLY == 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: generate-token
        name: Generate token
        if: ${{ steps.check-version.outputs.new_commit == 'true' && env.PUBLISH_NIGHTLY == 'true' }}
        run: |
          AZ_TOKEN=$(az account get-access-token --query accessToken)
          echo "::add-mask::$AZ_TOKEN"
          echo "access_token=$AZ_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Attest distributions
        if: steps.check-version.outputs.new_commit == 'true' && env.PUBLISH_NIGHTLY == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: wheelhouse/*.whl
      - name: Publish wheels to Azure DevOps
        if: ${{ steps.check-version.outputs.new_commit == 'true' && env.PUBLISH_NIGHTLY == 'true' }}
        env:
          TWINE_PASSWORD: ${{ steps.generate-token.outputs.access_token }}
        run: |
          python3 -m pip install twine
          python3 -m twine upload -r Triton-Nightly -u TritonArtifactsSP --config-file utils/nightly.pypirc --non-interactive --verbose wheelhouse/*

      - name: Azure Logout
        if: ${{ steps.check-version.outputs.new_commit == 'true' && env.PUBLISH_NIGHTLY == 'true' && (success() || failure()) }}
        run: |
          az logout
          az cache purge
          az account clear
