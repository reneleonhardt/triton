name: LLVM Build

on:
  push:
    branches:
      - main
    paths:
      - cmake/llvm-build-info.json
      - cmake/amd-llvm-build-info.json
      - third_party/amd/backend/codegen/**
      - include/triton/Tools/LLVMOptions.h
      - lib/Tools/LLVMOptions.cpp
  workflow_dispatch:

env:
  SCCACHE_DIR: ${{ github.workspace }}/sccache
  LLVM_DISTRIBUTION_COMPONENTS: "llvm-headers;llvm-libraries;cmake-exports;mlir-headers;mlir-libraries;mlir-cmake-exports;lld-headers;lld-libraries;lld-cmake-exports;clang;clang-resource-headers;FileCheck;not;split-file;llc;opt;llvm-config;mlir-tblgen;mlir-translate"

defaults:
  run:
    shell: bash -e -o pipefail {0}

permissions:
  contents: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Select changed LLVM packages
      id: packages
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        import subprocess

        if os.environ["EVENT_NAME"] == "workflow_dispatch":
            packages = ["llvm", "amd-codegen"]
        else:
            changed = subprocess.check_output([
                "git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
            ], text=True).splitlines()
            packages = []
            if "cmake/llvm-build-info.json" in changed:
                packages.append("llvm")
            if any(
                path in {"cmake/amd-llvm-build-info.json", "include/triton/Tools/LLVMOptions.h",
                         "lib/Tools/LLVMOptions.cpp"}
                or path.startswith("third_party/amd/backend/codegen/") for path in changed
            ):
                packages.append("amd-codegen")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            print("packages=" + json.dumps(packages), file=output)
        PYTHON

  build:
    needs: prepare
    if: needs.prepare.outputs.packages != '[]'
    name: Build ${{ matrix.package }} on ${{ matrix.config.runner }}
    runs-on: ${{ matrix.config.runs_on }}
    container: ${{ matrix.config.container }}

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}
        config:
        - {runner: 'Ubuntu 22.04', runs_on: 'ubuntu-22.04', target-os: 'ubuntu', arch: 'x64'}
        - {runner: 'Ubuntu 22.04 ARM64', runs_on: 'ubuntu-22.04-arm', target-os: 'ubuntu', arch: 'arm64'}
        - {runner: 'AlmaLinux 8', runs_on: 'ubuntu-22.04', target-os: 'almalinux', arch: 'x64', container: 'almalinux:8.10'}
        - {runner: 'AlmaLinux 8 ARM64', runs_on: 'ubuntu-22.04-arm', target-os: 'almalinux', arch: 'arm64', container: 'almalinux:8.10'}
        - {runner: 'MacOS X64', runs_on: 'macos-15-intel', target-os: 'macos', arch: 'x64'}
        - {runner: 'MacOS ARM64', runs_on: 'macos-15', target-os: 'macos', arch: 'arm64'}
        - {runner: 'Windows 2022', runs_on: 'windows-2022', target-os: 'windows', arch: 'x64', msvc_arch: 'amd64'}
        # MSVC 14.5x from VS 2026 runs out of heap on AMDGPU tables and ICEs on mlir-tblgen for ARM64; pin to 14.44.
        - {runner: 'Windows 11 ARM64', runs_on: 'windows-11-arm', target-os: 'windows', arch: 'arm64', msvc_arch: 'arm64', msvc_toolset: '14.44'}

    env:
      BUILD_PACKAGE: ${{ matrix.package }}
      BUILD_OS: ${{ matrix.config.target-os }}
      BUILD_ARCH: ${{ matrix.config.arch }}

    steps:

    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        path: llvm-build

    - name: Install System Prerequisites (AlmaLinux)
      if: matrix.config.target-os == 'almalinux'
      run: |
        rpm --import https://packages.microsoft.com/keys/microsoft.asc
        dnf install --assumeyes https://packages.microsoft.com/config/rhel/8/packages-microsoft-prod.rpm
        dnf install --assumeyes azure-cli llvm-toolset python3.11-pip python3.11-devel git jq tar gzip
        mkdir -p "$RUNNER_TEMP/python-bin"
        ln -s /usr/bin/python3.11 "$RUNNER_TEMP/python-bin/python3"
        echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"
        echo "extra_cmake_flags=-DCMAKE_ASM_COMPILER=clang -DCMAKE_CXX_FLAGS=-Wno-everything -DPython3_EXECUTABLE=/usr/bin/python3.11 -DPython_EXECUTABLE=/usr/bin/python3.11" >> "$GITHUB_ENV"

    - name: Fetch LLVM Build Metadata
      shell: bash
      run: |
        if [[ "${BUILD_PACKAGE}" == "llvm" ]]; then
          MANIFEST=llvm-build/cmake/llvm-build-info.json
          {
            echo 'llvm_projects=mlir;llvm;lld;clang'
            echo 'llvm_targets=host;NVPTX;AMDGPU'
            echo 'llvm_build_utils=ON'
            echo 'llvm_include_tests=ON'
            echo 'llvm_build_targets=check-mlir install-distribution'
          } >> "$GITHUB_ENV"
        else
          MANIFEST=llvm-build/cmake/amd-llvm-build-info.json
          {
            echo 'llvm_projects='
            echo 'llvm_targets=AMDGPU'
            echo 'llvm_build_utils=OFF'
            echo 'llvm_include_tests=OFF'
            echo 'llvm_build_targets=install-distribution'
            echo 'LLVM_DISTRIBUTION_COMPONENTS=llvm-headers;llvm-libraries;cmake-exports'
          } >> "$GITHUB_ENV"
        fi
        LLVM_COMMIT_HASH="$(jq -r '.llvm_hash' "$MANIFEST")"
        echo "Found LLVM commit hash: ${LLVM_COMMIT_HASH}"
        echo "llvm_commit_hash=${LLVM_COMMIT_HASH}" >> "$GITHUB_ENV"

        LLVM_REPOSITORY="$(jq -r '.repository // "llvm/llvm-project"' "$MANIFEST")"
        echo "Found LLVM repository: ${LLVM_REPOSITORY}"
        echo "llvm_repository=${LLVM_REPOSITORY}" >> "$GITHUB_ENV"

        LLVM_BUILD_NUMBER="$(jq -r '.build_number' "$MANIFEST")"
        echo "Found LLVM build number: ${LLVM_BUILD_NUMBER}"
        echo "llvm_build_number=${LLVM_BUILD_NUMBER}" >> "$GITHUB_ENV"

        SHORT_LLVM_COMMIT_HASH="${LLVM_COMMIT_HASH:0:8}"
        echo "Short LLVM commit hash: ${SHORT_LLVM_COMMIT_HASH}"
        echo "short_llvm_commit_hash=${SHORT_LLVM_COMMIT_HASH}" >> "$GITHUB_ENV"

        INSTALL_DIR="${BUILD_PACKAGE}-${SHORT_LLVM_COMMIT_HASH}-${BUILD_OS}-${BUILD_ARCH}-${LLVM_BUILD_NUMBER}"
        echo "LLVM installation directory name: ${INSTALL_DIR}"
        echo "llvm_install_dir=${INSTALL_DIR}" >> "$GITHUB_ENV"
        if [[ "${BUILD_PACKAGE}" == "llvm" ]]; then
          echo "llvm_sdk_dir=${INSTALL_DIR}" >> "$GITHUB_ENV"
        else
          echo "llvm_sdk_dir=$GITHUB_WORKSPACE/llvm-project/install" >> "$GITHUB_ENV"
        fi

    - name: Check LLVM Build Does Not Exist
      shell: bash
      run: |
        URL="https://oaitriton.blob.core.windows.net/public/llvm-builds/${llvm_install_dir}.tar.gz"
        HTTP_STATUS="$(curl --head --silent --show-error --output /dev/null --write-out "%{http_code}" "${URL}")"
        if [ "${HTTP_STATUS}" != "404" ]; then
          echo "LLVM build already exists or could not be checked: ${URL} returned ${HTTP_STATUS}"
          exit 1
        fi

    - name: Checkout LLVM
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: ${{ env.llvm_repository }}
        path: llvm-project
        ref: ${{ env.llvm_commit_hash }}

    - name: Set up Python
      if: matrix.config.target-os != 'almalinux'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.11

    - name: Set up MSVC
      if: matrix.config.target-os == 'windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ matrix.config.msvc_arch }}
        toolset: ${{ matrix.config.msvc_toolset }}

    - name: Install Prerequisites
      shell: bash
      run: |
        python3 -m pip install cmake ninja sccache
        mkdir -p "$SCCACHE_DIR"
        rm -rf "${SCCACHE_DIR:?}"/*

    - name: Enable Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ matrix.package }}-${{ matrix.config.target-os }}-${{ matrix.config.arch }}-${{ env.short_llvm_commit_hash }}
        restore-keys: ${{ matrix.package }}-${{ matrix.config.target-os }}-${{ matrix.config.arch }}-

    - name: Free disk space on Ubuntu
      if: matrix.config.arch == 'x64' && matrix.config.target-os == 'ubuntu'
      run: |
        df -h
        echo "Removing large packages"
        sudo apt-get remove -y 'php.*'
        sudo apt-get remove -y google-chrome-stable firefox powershell mono-devel
        sudo apt-get autoremove -y
        sudo apt-get clean
        df -h

    - name: Configure, Build, Test, and Install LLVM (Ubuntu, CentOS, and macOS)
      if: matrix.config.target-os == 'ubuntu' || matrix.config.target-os == 'almalinux' || matrix.config.target-os == 'macos'
      run: |
        read -ra extra_flags <<< "${extra_cmake_flags:-}"
        read -ra build_targets <<< "$llvm_build_targets"
        cmake -GNinja -Bllvm-project/build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
        -DCMAKE_INSTALL_PREFIX="${llvm_sdk_dir}" \
        -DCMAKE_LINKER=lld \
        -DLLVM_BUILD_UTILS="${llvm_build_utils}" \
        -DLLVM_BUILD_TOOLS=ON \
        -DLLVM_ENABLE_ASSERTIONS=ON \
        -DMLIR_ENABLE_BINDINGS_PYTHON=OFF \
        -DLLVM_ENABLE_PROJECTS="${llvm_projects}" \
        -DLLVM_DISTRIBUTION_COMPONENTS="${LLVM_DISTRIBUTION_COMPONENTS}" \
        -DLLVM_INSTALL_UTILS="${llvm_build_utils}" \
        -DLLVM_TARGETS_TO_BUILD="${llvm_targets}" \
        -DLLVM_INCLUDE_TESTS="${llvm_include_tests}" \
        -DLLVM_ENABLE_PIC=ON \
        -DBUILD_SHARED_LIBS=OFF \
        -DLLVM_BUILD_LLVM_DYLIB=OFF \
        -DLLVM_LINK_LLVM_DYLIB=OFF \
        -DLLVM_ENABLE_ZSTD=OFF \
        "${extra_flags[@]}" \
        llvm-project/llvm

        ninja -C llvm-project/build "${build_targets[@]}"

    - name: Configure, Build, Test, and Install LLVM (Windows)
      if: matrix.config.target-os == 'windows'
      run: |
        read -ra build_targets <<< "$llvm_build_targets"
        cmake -GNinja -Bllvm-project/build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
        -DCMAKE_INSTALL_PREFIX="${llvm_sdk_dir}" \
        -DLLVM_BUILD_UTILS="${llvm_build_utils}" \
        -DLLVM_BUILD_TOOLS=ON \
        -DLLVM_ENABLE_ASSERTIONS=ON \
        -DMLIR_ENABLE_BINDINGS_PYTHON=OFF \
        -DLLVM_ENABLE_PROJECTS="${llvm_projects}" \
        -DLLVM_DISTRIBUTION_COMPONENTS="${LLVM_DISTRIBUTION_COMPONENTS}" \
        -DLLVM_ENABLE_DIA_SDK=OFF \
        -DLLVM_INSTALL_UTILS="${llvm_build_utils}" \
        -DLLVM_TARGETS_TO_BUILD="${llvm_targets}" \
        -DLLVM_INCLUDE_TESTS="${llvm_include_tests}" \
        -DLLVM_ENABLE_PIC=ON \
        -DBUILD_SHARED_LIBS=OFF \
        -DLLVM_BUILD_LLVM_DYLIB=OFF \
        -DLLVM_LINK_LLVM_DYLIB=OFF \
        -DLLVM_ENABLE_ZSTD=OFF \
        llvm-project/llvm

        ninja -C llvm-project/build "${build_targets[@]}"


    - name: Build Standalone AMD Codegen
      if: matrix.package == 'amd-codegen'
      env:
        BUILD_CC: ${{ matrix.config.target-os == 'windows' && 'cl' || 'clang' }}
        BUILD_CXX: ${{ matrix.config.target-os == 'windows' && 'cl' || 'clang++' }}
      run: |
        cmake -GNinja -B amd-codegen-build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER="$BUILD_CC" \
        -DCMAKE_CXX_COMPILER="$BUILD_CXX" \
        -DLLVM_DIR="${llvm_sdk_dir}/lib/cmake/llvm" \
        -DCMAKE_INSTALL_PREFIX="${llvm_install_dir}" \
        -DTRITON_AMD_LLVM_REVISION="${llvm_commit_hash}-${llvm_build_number}" \
        llvm-build/third_party/amd/backend/codegen

        ninja -C amd-codegen-build install

    - name: Verify Standalone Library
      if: matrix.package == 'amd-codegen'
      shell: bash
      run: |
        python3 - <<'PY'
        import ctypes
        import os
        import pathlib
        import sys

        filename = {
            "win32": "triton_amd_codegen.dll",
            "darwin": "libtriton_amd_codegen.dylib",
        }.get(sys.platform, "libtriton_amd_codegen.so")
        path = pathlib.Path(os.environ["llvm_install_dir"]) / "lib" / filename
        library = ctypes.CDLL(str(path.resolve()))
        library.triton_amdgpu_revision.restype = ctypes.c_char_p
        expected = os.environ["llvm_commit_hash"] + "-" + os.environ["llvm_build_number"]
        assert library.triton_amdgpu_revision().decode() == expected
        print("Loaded standalone backend without importing Triton:", path)
        PY

    - name: Package Build Artifacts
      shell: bash
      run: tar czf "${llvm_install_dir}.tar.gz" "${llvm_install_dir}"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.package }}-${{ matrix.config.target-os }}-${{ matrix.config.arch }}
        path: |
          ${{ github.workspace }}/${{ env.llvm_install_dir }}.tar.gz

    - name: Azure login
      if: ${{ (github.repository == 'triton-lang/triton') && github.ref_name == 'main' }}
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID_LLVM }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID_LLVM }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_LLVM }}

    - name: Upload LLVM Artifacts to Azure
      if: ${{ (github.repository == 'triton-lang/triton') && github.ref_name == 'main' }}
      shell: bash -el {0}
      run: |
        sha256sum "${llvm_install_dir}.tar.gz"

        az storage blob upload --account-name oaitriton --auth-mode login --container-name public --file "${llvm_install_dir}.tar.gz" --name "llvm-builds/${llvm_install_dir}.tar.gz"

        URL=$(az storage blob url --account-name oaitriton --auth-mode login --container-name public --name "llvm-builds/${llvm_install_dir}.tar.gz")
        echo "Blob URL: ${URL}"

    - name: Azure Logout
      if: ${{ (github.repository == 'triton-lang/triton') && github.ref_name == 'main' }}
      run: |
        az logout
        az cache purge
        az account clear

    - name: Dump Sccache Statistics
      run: sccache --show-stats
